[[cors]]
allowed_origins = "*"
allowed_methods = ["GET", "POST"]
allowed_headers = "*"

[[headers]]
for = ["**/*.woff2", "**/*.woff", "**/*.svg", "**/*.ttf", "**/*.otf", "**/*.eot", "**/*.js", "**/*.css"]
compress = "gzip"
[headers.values]
Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
for = ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif", "**/*.webp"]
[headers.values]
Cache-Control = "max-age=31536000, no-transform, public"

[[redirects]]
from = "/actualites/2021-01-01-sebastien-gaya/index.html"
to = "/actualites/2021-09-01-sebastien-gaya/"

[[redirects]]
from = "/projets/index.html"
to = "/references/"

[[redirects]]
from = "/metiers/sites/index.html"
to = "/sites/"

[[redirects]]
from = "/metiers/formation/index.html"
to = "/formation/"

[[redirects]]
from = "/metiers/conseil/index.html"
to = "/conseil/"

[[redirects]]
from = "/metiers/applications/index.html"
to = "/applications/"

[[redirects]]
